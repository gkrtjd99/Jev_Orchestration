name: native-hook-local-contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --offline
      - run: npm run check
      - run: npm test
      - run: npm run eval:router
# This workflow does not claim native runtime or paid-model coverage.
